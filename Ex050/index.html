 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilo/style.css">
    <title>Tarefas </title>
 </head>
 <body>
    <header id="task-header">
         <div id="task-container">
             <h2>Salve Sua Proxima Tarefa:</h2>
             <form action="" id="add-task-form">
               <input type="text" name="" id="task-title" placeholder="Qual e a sua Tarefa" >
               <i class="fa-solid fa-plus" id="add-btn"></i>
                
                

             </form>
         </div>

    </header>

    <section id="y-task-container">
           <h2>Estas Sao as suas Tarefas:</h2>
            <div class="hide template ">
              <div class="y-task">
                <span class="task-title"></span>
                <div id="icons-task">
                  <i class="fa-solid fa-check"></i>
                  <i class="fa-solid fa-xmark"></i>
                </div>
               </div>
           </div>
            
            
    </section>
    <script src="js/js50.js"></script>
 </body>
 </html>
