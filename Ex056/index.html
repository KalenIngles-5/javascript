<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Address</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/js.js"defer></script>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--BootstrapIcons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
</head>
<body id="checkout-Page">

    <div id="fade" class="hide">
       <div id="loader" class="spinner-border text-info hide" role="status">
        <span class="visually-hidden">Loading...</span>
       </div>

       <div id="message" class="hide">
        <div class="alert alert-light" role="alert">
            <h4>Mensagem:</h4>
            <p>Texto da mensagem...</p>
            <button id="close-message" type="button" class="btn btn-secondary">
                fechar
            </button>
          </div>
       </div>
    </div>

    <div id="order-form-container" class="container ">
        <div id="steps" class="mb-md-3 pb-md-3">
            <div class="line"></div>
            <div class="step">
                <i class="bi bi-person active"></i>
                <p class="d-none d-md-block">Criacao de Conta</p>
            </div>
            <div class="step">
                <i class="bi bi-geo-alt active"></i>
                <p class="d-none d-md-block">Endereco</p>
            </div>

            <div class="step">
                <i class="bi bi-credit-card"></i>
                <p class="d-none d-md-block">Pagamento</p>
            </div>
        </div>

        <div id="form-header">
            <h2>Cadastre o seu endereco</h2>
            <p>Preencha os campos para podermos enviar os seus produtos</p>
        </div>

        <form action="" class="address-form">
            <div class="row mb-3">
                <div class="form-floating">
                    <input 
                    type="text" 
                    class="form-control shadow-none" 
                    id="cep" 
                    name="cep" 
                    placeholder="Digite o seu CEP"
                    minlength="8" 
                    maxlength="8" 
                    required
                    >
                    <label for="cep">Digite o seu CEP</label>
                </div>
            </div>

            <div class="row mb-2">

               <div id="items-form" class="form-floating col-12 col-sm-6 mb-3 sm-0">
                    <input 
                    type="text" 
                    class="form-control shadow-none" 
                    id="address" 
                    name="Address" 
                    placeholder="RUA"
                    disabled
                    required
                    data-input
                    >
                    
                    <label for="Address">Rua</label>
                </div>
                
                <div id="items-form" class="form-floating col-12 col-sm-6 mb-3 sm-0">
                    <input 
                    type="text" 
                    class="form-control shadow-none" 
                    id="number" 
                    name="Number" 
                    placeholder="Digite o numero da Residencia"
                    disabled
                    required
                    data-input
                    >
                    
                    <label for="Number"> Digite o numero da residencia</label>
                </div>
            </div>
            <div class="row mb-2">

               <div id="items-form" class="form-floating col-12 col-sm-6 mb-3 sm-0">
                    <input 
                    type="text" 
                    class="form-control shadow-none" 
                    id="complement" 
                    name="Complement" 
                    placeholder="Digite o seu complemento"
                    disabled
                    data-input
                    >
                    
                    <label for="complement">Digite o seu complemento</label>
                </div>
                
                <div id="items-form" class="form-floating col-12 col-sm-6 mb-3 sm-0">
                    <input 
                    type="text" 
                    class="form-control shadow-none" 
                    id="neighborhood" 
                    name="neighborhood" 
                    placeholder="Digite o numero da Residencia"
                    disabled
                    required
                    data-input
                    >
                    
                    <label for="neighborhood"> Digite o numero da residencia</label>
                </div>
            </div>
            <div class="row mb-2">

               <div id="items-form" class="form-floating col-12 col-sm-6 mb-3 sm-0">
                    <input 
                    type="text" 
                    class="form-control shadow-none" 
                    id="city" 
                    name="City" 
                    placeholder="City"
                    disabled
                    data-input
                    >
                    
                    <label for="complement">City</label>
                </div>
                
                <div id="items-form" class="form-floating col-12 col-sm-6 mb-3 sm-0">
                 <select 

                name="region"
                id="region"
                class="form-select shadow-none"
                disabled 
                required 
                data-input
                >
            
             <option selected>Estado</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
                
            
                 </select>
                </div>
            </div>

            <div class="d-flex justify-content-end">
                <button id="save-btn" type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
            
        </form>

    </div>
  
</body>
</html>
